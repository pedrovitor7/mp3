  <title>Minha Música</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: rgb(232, 227, 227);
      --blue: #4c3dbc;
      --text: #447ab1;
      --muted: #385e5d;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(168, 85, 247, .22), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, .17), transparent 30%),
        linear-gradient(145deg, #050510, #0c1020 55%, #070711);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      background: rgba(139, 92, 246, .18);
      animation: float 7s ease-in-out infinite alternate;
    }

    .player {
      position: relative;
      z-index: 1;
      width: min(410px, 100%);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 32px;
      background: rgba(12, 15, 30, .7);
      box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px);
    }

    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .status { display: flex; gap: 5px; align-items: end; height: 15px; }
    .status span { width: 3px; height: 5px; border-radius: 8px; background: var(--purple); }
    .playing .status span { animation: bars .8s ease-in-out infinite alternate; }
    .status span:nth-child(2) { animation-delay: -.25s; }
    .status span:nth-child(3) { animation-delay: -.5s; }
    .status span:nth-child(4) { animation-delay: -.15s; }

    .cover {
      position: relative;
      width: 230px;
      aspect-ratio: 1;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #171827 0 4px, #0c0d16 5px 8px);
      box-shadow: 0 0 0 8px rgba(255,255,255,.035), 0 24px 50px rgba(0,0,0,.48);
    }

@keyframes flicker0 {
  0%,
  49% {

  }
  50%,
  100% {

  }

  }

#eye {
  width: 40px;
  height: 50px;
  position: absolute;
  top: 30px;
  left: 10px;
}

#eye::before {
  content: "";
  background-color: white;
  width: 20px;
  height: 50px;
  transform: translateX(10px);
  display: block;
  position: absolute;
}

#eye::after {
  content: "";
  background-color: white;
  width: 40px;
  height: 30px;
  transform: translateY(10px);
  display: block;
  position: absolute;
}

#eye1 {
  width: 40px;
  height: 50px;
  position: absolute;
  top: 30px;
  right: 30px;
}

#eye1::before {
  content: "";
  background-color: white;
  width: 20px;
  height: 50px;
  transform: translateX(10px);
  display: block;
  position: absolute;
}

#eye1::after {
  content: "";
  background-color: white;
  width: 40px;
  height: 30px;
  transform: translateY(10px);
  display: block;

}

#pupil {
  width: 20px;
  height: 20px;
  background-color: blue;
  position: absolute;
  top: 50px;
  left: 10px;
  z-index: 1;
  animation: eyesMovement infinite 3s;
}

#pupil1 {
  width: 20px;

  position: absolute;
  top: 50px;
  right: 50px;
  z-index: 1;
  animation: eyesMovement infinite 3s;
}

@keyframes eyesMovement {
  0%,
  49% {
    transform: translateX(0px);
  }
  50%,
  99% {
    transform: translateX(10px);
  }
  100% {
    transform: translateX(0px);
  }
}

#shadow {
  background-color: black;
  width: 140px;
  height: 140px;
  position: absolute;
  border-radius: 50%;
  transform: rotateX(80deg);
  filter: blur(20px);
  top: 80%;
  animation: shadowMovement infinite 0.5s;
}

@keyframes shadowMovement {
  0%,
  49% {
    opacity: 0.5;
  }
  50%,
  100% {

  }
}


    .playing .cover { animation: spin 7s linear infinite; }

    .info { text-align: center; margin-bottom: 23px; }
    h1 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 25px; letter-spacing: -.04em; }
    .artist { margin-top: 6px; color: var(--muted); font-size: 14px; }

    .progress { width: 100%; height: 5px; border-radius: 99px; cursor: pointer; accent-color: var(--purple); }
    .time { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .controls { display: flex; align-items: center; justify-content: center; margin: 22px 0; }
    button { border: 0; color: white; cursor: pointer; }
    .play {
      width: 68px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 25px;
      background: linear-gradient(135deg, var(--purple), #7c3aed 48%, var(--blue));
      box-shadow: 0 12px 32px rgba(139,92,246,.38);
      transition: transform .2s, box-shadow .2s;
    }
    .play:hover { transform: scale(1.07); box-shadow: 0 14px 38px rgba(139,92,246,.58); }
    .play:active { transform: scale(.96); }

    .bottom { display: flex; align-items: center; gap: 13px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); }
    .volume { flex: 1; height: 4px; accent-color: var(--blue); cursor: pointer; }
    .choose { padding: 9px 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: #cbd5e1; font-size: 12px; background: rgba(255,255,255,.055); transition: .2s; }
    .choose:hover { color: white; background: rgba(255,255,255,.1); }
    input[type="file"] { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bars { to { height: 15px; background: var(--blue); } }
    @keyframes float { to { transform: translate(90px, -70px) scale(1.2); } }

    @media (max-width: 430px) {
      .player { padding: 23px; border-radius: 27px; }

    </div>

      <span aria-hidden="true">🔊</span>
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      <label class="choose" for="file">Trocar música</label>
      <input id="file" type="file" accept="audio/*">
    </div>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playButton = document.getElementById('play');
    const progress = document.getElementById('progress');
    const volume = document.getElementById('volume');
    const current = document.getElementById('current');
    const duration = document.getElementById('duration');
    const player = document.getElementById('player');
    const file = document.getElementById('file');
    const title = document.getElementById('title');

    audio.volume = volume.value;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }
    <!--ESSE TALVEX ESTEJA ALI ANOTADO HEHE-->

    function updateButton(isPlaying) {
      playButton.textContent = isPlaying ? '❚❚' : '▶';
      playButton.setAttribute('aria-label', isPlaying ? 'Pausar música' : 'Tocar música');
      player.classList.toggle('playing', isPlaying);
    }

    playButton.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch { alert('Coloque o arquivo musica.mp3 na mesma pasta do HTML ou clique em “Trocar música”.'); }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => updateButton(true));
    audio.addEventListener('pause', () => updateButton(false));
    audio.addEventListener('ended', () => updateButton(false));

    audio.addEventListener('loadedmetadata', () => duration.textContent = formatTime(audio.duration));
    audio.addEventListener('timeupdate', () => {
      current.textContent = formatTime(audio.currentTime);
      progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    });

    progress.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
    });

    volume.addEventListener('input', () => audio.volume = volume.value);

    file.addEventListener('change', () => {
      const selected = file.files[0];
      if (!selected) return;
      audio.src = URL.createObjectURL(selected);
      title.textContent = selected.name.replace(/\.[^/.]+$/, '');
      audio.play();
    });
  </script>
